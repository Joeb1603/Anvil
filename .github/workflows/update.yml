# Keeps the archive and the Empire Atlas in step with the Empire wiki.
#
# Checks every morning. Updates on Mondays, and on any day while a summit is approaching
# (new Winds of Fortune or Winds of War pages in the last three weeks). Only pages edited since the
# last run are downloaded. Changes are committed to main and the atlas is republished.
#
# Also rebuilds the atlas when its hand-made inputs change on main (control history, region
# positions, extra territories, or the build code), for example after merging a pull request.
name: Update from the wiki

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "map/control_raw/**"
      - "map/extra_territories.json"
      - "map/region_labels.json"
      - "map/nation_history.json"
      - "map/checks_accepted.json"
      - "mapbuilder/**"
      - "scraper/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the latest main, even for a run that waited in the queue

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # pandoc renders the odd page the wiki's own renderer fails on (see scraper/fetch.py)
      - run: sudo apt-get install -y -q pandoc || echo "pandoc unavailable; such pages are kept as plain text"

      - name: Decide whether to update today
        id: gate
        run: python3 -m scraper.check_schedule ${{ github.event_name != 'schedule' && '--force' || '' }}

      # Cached page downloads. If the cache has expired, the update re-downloads everything (about 45 minutes).
      - name: Restore download cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: wiki-cache-${{ github.run_id }}
          restore-keys: wiki-cache-

      - name: Update the archive
        if: steps.gate.outputs.run == 'true'
        run: python3 -m scraper.run --strict

      - name: Rebuild the atlas
        if: steps.gate.outputs.run == 'true'
        run: python3 -m mapbuilder.run

      # Summaries for new or edited events (a few cents each; does nothing without the API key secret)
      - name: Summarise new events
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -m mapbuilder.summarise --limit 60 || echo "::warning::Summaries not updated"
          python3 -m mapbuilder.build

      # The build also runs the atlas checks (map/checks.md). A wiki change can't be refused, so failures
      # here are flagged on the run, committed with the update, and fixed by the twice-weekly Claude task.
      - name: Report atlas checks
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 -c "
          import json
          r = json.load(open('map/checks.json'))
          for x in r['failures']: print('::warning title=Atlas check::' + x['msg'])
          print(len(r['failures']), 'failures,', len(r['warnings']), 'warnings')
          "

      - name: Save download cache
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: wiki-cache-${{ github.run_id }}

      # If main moved while this ran (for example an atlas update was applied), rebuild on top of the new
      # main from the downloaded pages and try again, so nothing is lost and nothing conflicts.
      - name: Commit and push changes
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(python3 -c "import json; c=json.load(open('.cache/changed.json')); print(f'{len(c)} new or edited wiki pages')")
          details=$(python3 -c "import json; c=json.load(open('.cache/changed.json')); print('\n'.join('- ' + t for t in c[:50]) + ('\n- ...' if len(c) > 50 else ''))")
          for attempt in 1 2 3; do
            git add -A wiki data map
            if git diff --cached --quiet; then
              echo "Nothing changed."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -q -m "Update from the Empire wiki: $summary" -m "$details"
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved while updating; rebuilding on the new main ($attempt)"
            git fetch origin main
            git reset --hard origin/main
            python3 -m scraper.run --skip-fetch --strict
            python3 -m mapbuilder.run
          done
          echo "::error::Could not push to main after three attempts."
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.pushed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
