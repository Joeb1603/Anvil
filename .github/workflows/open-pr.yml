# Opens a pull request for each branch the scheduled Claude task pushes (claude/atlas-*), so its
# updates always arrive for review even if the session had no tool for opening pull requests.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Open pull request for atlas updates

on:
  push:
    branches: ["claude/atlas-**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const { data: open } = await github.rest.pulls.list({
              ...context.repo, head: `${context.repo.owner}:${branch}`, state: "open" });
            if (open.length) { core.info(`Pull request already open: #${open[0].number}`); return; }
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: context.sha });
            const [title, ...rest] = commit.commit.message.split("\n");
            const body = rest.join("\n").trim() +
              "\n\nOpened automatically for review. Merging rebuilds and republishes the atlas.";
            const pr = await github.rest.pulls.create({ ...context.repo, head: branch, base: "main", title, body });
            core.info(`Opened #${pr.data.number}`);
