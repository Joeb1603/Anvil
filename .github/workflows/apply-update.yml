# Applies each update the scheduled Claude task pushes (a claude/atlas-* branch) straight to main:
# merges it, rebuilds the atlas, and stops if the build reports any problem. If it passes, the
# result goes to main, the site is republished and the branch is deleted. Failed runs leave main
# untouched and keep the branch, and GitHub emails the repository owner.
name: Apply atlas update

on:
  push:
    branches: ["claude/atlas-**"]

permissions:
  contents: write
  pages: write
  id-token: write

# Own queue, so a waiting update is never replaced by a newer run of the daily wiki update.
concurrency:
  group: atlas-apply-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Merge, rebuild, check, push. If main moved in the meantime, start again from the new main.
      - name: Merge, rebuild, check and push to main
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main "$BRANCH"
            git reset --hard origin/main
            git merge --no-ff --no-edit "origin/$BRANCH" -m "Apply atlas update from $BRANCH"
            python3 -m mapbuilder.run | tee build.log
            if grep -q "^issues:" build.log; then
              echo "::error::The atlas build reported problems with this update; main was not changed."
              exit 1
            fi
            git add -A map
            git diff --cached --quiet || git commit -m "Rebuild atlas after $BRANCH"
            if git push origin HEAD:main; then
              git push origin --delete "$BRANCH"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved while applying; trying again ($attempt)"
          done
          echo "::error::Could not push to main after three attempts."
          exit 1

  deploy:
    needs: apply
    if: needs.apply.outputs.pushed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
