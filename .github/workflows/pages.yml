# Publishes the Empire Atlas (map/) to GitHub Pages at test.joe-bainbridge.com.
# Only map/ is uploaded, so the wiki archive and scraper data are not part of the site.
name: Publish atlas

on:
  push:
    branches: [main]
    paths: ["map/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:   # run by the wiki update after it pushes, since its own pushes don't trigger this

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: map
      # GitHub's Pages service occasionally fails to find the just-uploaded site ("Fetching artifact
      # metadata failed"); wait and try once more so a passing blip never leaves the site out of date.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
