# How wiki pages are sorted into wiki/<class>/<topic>/.
#
# class is one of: in-character, mixed (lore plus game rules), out-of-character.
# A page takes the FIRST rule below that lists one of its categories, so order matters:
# dated records first, then clearly out-of-character material, then mechanics, then lore.
# Edit this file and re-run `python3 -m scraper.run --skip-fetch` to re-sort everything.

ignore_categories: [Pages with broken file links, Noindexed pages, Hidden categories, Templates]
ignore_category_prefixes: ["Photos:", "Photo:", "PhotosJ"]

# Namespaces whose pages always take the namespace default, whatever their categories.
namespace_forced: [Help, Crew, Draft]

namespace_defaults:
  Help: {class: out-of-character, topic: help}
  Crew: {class: out-of-character, topic: crew}
  Draft: {class: out-of-character, topic: drafts}
  Archive: {class: mixed, topic: archive}
  Category: {class: out-of-character, topic: categories}

default: {class: uncategorised, topic: unsorted}

# The wiki's CC BY-SA licence excludes music and lyrics. Pages in these topics are written to
# wiki/ as a title and a link only; their full text goes to local-only/ (never committed).
not_openly_licensed_topics: [music]

# Pages with a song block and no category that matches a rule are treated as music.
song_pages: {class: mixed, topic: music}

# Individual pages with no useful category, placed by hand.
page_overrides:
  Main Page: {class: out-of-character, topic: site}
  "Imperial:Breadcrumbs": {class: out-of-character, topic: site}
  "Imperial:Footer": {class: out-of-character, topic: site}
  "Imperial:LeftBar": {class: out-of-character, topic: site}
  "Imperial:TitleBar": {class: out-of-character, topic: site}
  Contact Profound Decisions: {class: out-of-character, topic: site}
  Feedback: {class: out-of-character, topic: site}
  "Forums & Facebook": {class: out-of-character, topic: site}
  FreeToUseImageLinks: {class: out-of-character, topic: site}
  Photography: {class: out-of-character, topic: site}
  Streaming: {class: out-of-character, topic: site}
  Style guide: {class: out-of-character, topic: site}
  Terms and conditions: {class: out-of-character, topic: site}
  Sanctioned event advice: {class: out-of-character, topic: events}
  Summer Solstice 2013: {class: out-of-character, topic: events}
  Cantina El Burrito: {class: out-of-character, topic: events}
  Routes Coffee: {class: out-of-character, topic: events}
  Tangled Vine: {class: out-of-character, topic: events}
  Appropriate roleplaying: {class: out-of-character, topic: rules}
  Coif: {class: out-of-character, topic: costume}
  Cotehardie: {class: out-of-character, topic: costume}
  Kirtle: {class: out-of-character, topic: costume}
  Orc: {class: mixed, topic: world}
  Region qualities: {class: mixed, topic: economy}
  Trade goods: {class: mixed, topic: economy}
  Register of civil service gifts: {class: mixed, topic: government/senate}
  Senate Motions: {class: mixed, topic: government/senate}
  Clemency guidance: {class: mixed, topic: government/senate}
  Dramaturgy Archive: {class: mixed, topic: magic/lore}
  Egregores: {class: in-character, topic: nations/general}
  Eternals and rituals: {class: mixed, topic: magic/lore}
  Past life vision: {class: mixed, topic: religion}
  Archetype: {class: mixed, topic: nations/general}
  Group Archetypes: {class: mixed, topic: nations/general}

# Checked before the category rules (first match wins).
title_rules:
  - {pattern: 'Announcements? (by|of) ', class: in-character, topic: announcements}
  - {pattern: 'Military Council orders$', class: in-character, topic: military-council-orders}
  - {pattern: 'Sodality resolutions$', class: in-character, topic: conclave-sessions}
  - {pattern: 'Imperial elections$', class: in-character, topic: elections}
  - {pattern: '(?i)look and feel', class: mixed, topic: look-and-feel}
  - {pattern: ' groups$', class: out-of-character, topic: groups}
# Used only when a page has no category that matches a rule below.
fallback_title_rules:
  - {pattern: 'event schedule$', class: out-of-character, topic: events}

