  - {topic: nations/wintermark, class: in-character, categories: [Wintermark]}
  - {topic: nations/dawn, class: in-character, categories: [Dawn]}
  - {topic: nations/highguard, class: in-character, categories: [Highguard]}
  - {topic: nations/the-brass-coast, class: in-character, categories: [The Brass Coast]}
  - {topic: nations/imperial-orcs, class: in-character, categories: [Imperial Orcs]}
  - {topic: nations/general, class: in-character, categories: [Nations, Archetype, Egregore]}
  - topic: foreign-nations
    class: in-character
    categories: [Foreign Nations, Foreign Nation, Foreigners, Sarcophan, Axos, Asavea, Asavean Archipelago,
                 Commonwealth, Faraden, Iron Confederacy, Sumaah, Jarm, Tsark, Skoura, Otkodov]
  - topic: barbarians
    class: in-character
    categories: [Barbarians, Grendel, Thule, Jotun, Druj, Great Forest Orcs, The Mallum, Orc Affairs]
  - topic: world
    class: in-character
    categories: [The World, The Empire, Gazetteer, Imperial Territory, Maps, Sentinel Gate, Bestiary, Vallorn,
                 Traders, Merrow, Free Folk, Monster]
  - {topic: history, class: in-character, categories: [History, Recent History]}
