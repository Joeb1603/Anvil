<title>Empire Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a campaign table. Map fills the left, a ledger panel sits right, the season rail runs along the bottom. */
:root {

  --n1: #8d99a6; --n2: #b9c2cc; --gold: #b8860b; --barb: #a50f2f;
  --display: "Alegreya Sans SC", "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --surface: #171f29; --sunk: #121922; --ink: #e7ecf2; --muted: #98a5b4; --line: #2a3644;
  --accent: #a9c4e6; --accent-ink: #0f151c; --sea: #0b1118; --land: #232d39; --outline: #c9d3de;
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s5: #e24d8b; --s6: #0aac23; --s7: #9887ef; --s8: #eb6263;
  --n1: #66727f; --n2: #414c59; --gold: #e3b341; --barb: #ff4f73; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #171f29; --sunk: #121922; --ink: #e7ecf2; --muted: #98a5b4; --line: #2a3644;
  --accent: #a9c4e6; --accent-ink: #0f151c; --sea: #0b1118; --land: #232d39; --outline: #c9d3de;
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --s4: #d28e05; --s5: #e24d8b; --s6: #0aac23; --s7: #9887ef; --s8: #eb6263;
  --n1: #66727f; --n2: #414c59; --gold: #e3b341; --barb: #ff4f73; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.search { position: relative; }
.search input { width: 220px; max-width: 100%; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.results { position: absolute; z-index: 20; top: calc(100% + 4px); right: 0; width: min(340px, 86vw); max-height: 320px; overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); padding: 4px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; min-height: 0; }
.mapwrap { position: relative; background: var(--sea); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 300px; display: flex; flex-direction: column; }
#map { width: 100%; flex: 1; min-height: 0; display: block; touch-action: none; cursor: grab; user-select: none; }
#map.drag { cursor: grabbing; }
.cell { stroke: var(--surface); stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; }
.cell.dim { opacity: .18; }
.pat { pointer-events: none; }
.sea { fill: var(--sea); stroke: none; }
.outline { fill: none; stroke: var(--outline); stroke-width: 1.4; vector-effect: non-scaling-stroke; pointer-events: none; }
.outline.sel { stroke: var(--ink); stroke-width: 3.2; }
.regsel { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; pointer-events: none; }

  paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; letter-spacing: .03em; }

  border-radius: 6px; padding: 5px 9px; font-size: .8rem; pointer-events: none; }

.note { padding: 4px 10px; font-size: .8rem; color: var(--muted); background: var(--surface); border-top: 1px solid var(--line); }
.tip { position: absolute; z-index: 15; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 9px; box-shadow: 0 6px 18px rgb(0 0 0 / .18); font-size: .88rem; max-width: 260px; }
.tip b { font-family: var(--display); letter-spacing: .03em; }
.tip div { color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 6px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.pbody { overflow: auto; padding: 12px 14px 16px; min-height: 0; flex: 1; }
.pbody h2 { font-family: var(--display); font-size: 1.35rem; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.pbody h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
.crumb { color: var(--muted); font-size: .88rem; }
.crumb button, .linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
.holder { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

.row { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 3px 4px; border-radius: 4px; cursor: pointer; }

.num { font-variant-numeric: tabular-nums; color: var(--muted); }
.ev { border-top: 1px solid var(--line); padding: 8px 0; }
.ev:first-child { border-top: 0; }
.ev .meta { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.ev a { font-weight: 700; text-decoration: none; }
.ev a:hover { text-decoration: underline; }
.ev p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.tag { border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: .76rem; color: var(--ink); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 9px; cursor: pointer; font-size: .82rem; }
.chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chg { padding: 5px 0; border-top: 1px dashed var(--line); font-size: .92rem; }
.chg:first-child { border-top: 0; }
.unsure { color: var(--muted); font-style: italic; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

.legend .row[aria-pressed="true"] { background: var(--sunk); outline: 1px solid var(--line); }

.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 6px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; }

.now small { display: block; font-family: var(--body); font-weight: 400; font-size: .8rem; color: var(--muted); letter-spacing: 0; }

.transport button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.track { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
#hist { position: relative; }
.brk { position: absolute; top: -4px; bottom: 0; width: 0; border-left: 2px dashed var(--muted); pointer-events: auto; }
.brk span { position: absolute; top: -2px; left: 4px; font-size: .68rem; line-height: 1.2; color: var(--muted); background: var(--surface);
  padding: 0 4px; border-radius: 3px; white-space: nowrap; }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--muted); background: var(--sunk); border-radius: 4px; padding: 8px 10px; margin-top: 10px; font-size: .92rem; }

#hist { display: grid; align-items: end; height: 30px; gap: 2px; }
#hist button { border: 0; padding: 0; background: var(--n2); border-radius: 2px 2px 0 0; cursor: pointer; min-height: 2px; }
#hist button.on { background: var(--accent); }
#years { display: grid; gap: 2px; font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; height: 1.1em; }
#years span { white-space: nowrap; overflow: visible; border-left: 1px solid var(--line); padding-left: 3px; min-width: 0; }
#season { width: 100%; margin: 0; accent-color: var(--accent); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: auto; }
  #map { flex: none; aspect-ratio: 1.12; }
  .panel { max-height: none; }
  .pbody { overflow: visible; }
  .controls { margin-left: 0; }
  .rail { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; grid-template-columns: minmax(0, 1fr) auto; }
  .now { grid-column: 1; grid-row: 1; min-width: 0; }
  .transport { grid-column: 2; grid-row: 1; align-self: center; }
  .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1 class="brand">Empire Atlas <small id="snap"></small></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="Colour the map by">
        <button id="mode-holder" aria-pressed="true">By holder</button>
        <button id="mode-territory" aria-pressed="false">By territory</button>
      </div>
      <div class="labgroup">Labels
        <div class="seg" role="group" aria-label="Map labels">
          <button id="lab-nations" aria-pressed="false">Nations</button>
          <button id="lab-territories" aria-pressed="true">Territories</button>
          <button id="lab-regions" aria-pressed="false">Regions</button>
          <button id="lab-none" aria-pressed="false">None</button>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="show-regions" checked> Regions</label>
      <label class="check"><input type="checkbox" id="show-front" checked> Frontiers</label>
      <label class="check"><input type="checkbox" id="show-marks" checked> Event counts</label>
      <div class="search">
        <input id="q" type="search" placeholder="Find a place or event" autocomplete="off" aria-label="Find a place or event">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="img" aria-label="Map of the Empire and neighbouring territories"></svg>
      <div class="flegend" id="flegend"><span><i class="gold"></i>Imperial lands</span><span><i class="barb"></i>Barbarian lands</span></div>
      <div class="zoom">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zreset" aria-label="Reset view">⌂</button>
      </div>
      <div class="note">Territory outlines are from the wiki's own map. Region borders are approximate: each region is placed by its label on the wiki's picture maps. Event text © Profound Decisions, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>, from the <a href="https://www.profounddecisions.co.uk/empire-wiki/Main_Page" target="_blank" rel="noopener">Empire wiki</a>.</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-place" aria-selected="true">Season</button>
        <button role="tab" id="tab-holders" aria-selected="false">Holders</button>
        <button role="tab" id="tab-history" aria-selected="false">Earlier history</button>
      </div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>

  <footer class="rail">
    <div class="now" id="now"></div>
    <div class="track">
      <div id="hist" aria-label="Located events per season"></div>
      <div id="years" aria-hidden="true"></div>
      <input id="season" type="range" min="0" step="1" aria-label="Season">
    </div>
    <div class="transport">
      <button id="prev" aria-label="Previous season">◀</button>
      <button id="play" aria-label="Play">▶ Play</button>
      <button id="next" aria-label="Next season">▶</button>
    </div>
  </footer>
</div>

<script>
(() => {

const load = window.__ATLAS__ ? Promise.resolve(window.__ATLAS__) : fetch("data.json").then(r => r.json());
load.then(init).catch(err => { $("pbody").textContent = "The map data could not be loaded: " + err.message; });

function init(D) {

  const busy = S.map((_, i) => D.events.filter(e => e.s === i).length);
  let open = last; while (open > 0 && busy[open] < 10) open--;
  const st = { s: open, mode: "holder", sel: null, tab: "place", types: new Set(types), iso: null, k: 1, x: 0, y: 0, regions: true, marks: true, playing: null, lab: "territories", front: true };
  $("snap").textContent = "wiki snapshot " + D.meta.snapshot.slice(0, 10);

  // ---- control state: holder of every place at every season
  const ctl = {};
  for (const t of T) {
    const start = D.control.start[t.name] || "unknown";
    const sr = (D.control.startRegions || {})[t.name] || {};
    ctl[t.name] = { "": Array(S.length).fill(start) };
    for (const r of t.regions) ctl[t.name][r.name] = Array(S.length).fill(sr[r.name] || start);
  }

  }
  const holderAt = (t, r, s) => (ctl[t][r || ""] || ctl[t][""])[s];
  const majority = (t, s) => { const tt = byName[t]; if (!tt.regions.length) return holderAt(t, "", s);
    const n = {}; for (const r of tt.regions) { const x = holderAt(t, r.name, s); n[x] = (n[x] || 0) + 1; }
    return Object.entries(n).sort((a, b) => b[1] - a[1])[0][0]; };

  // ---- events indexed by season and place
  const evBySeason = S.map(() => []);
  D.events.forEach(e => evBySeason[e.s].push(e));
  const evByTerr = {}; D.events.forEach(e => { for (const t in e.pl) (evByTerr[t] = evByTerr[t] || []).push(e); });
  const countAt = (t, s) => evBySeason[s].reduce((n, e) => n + (e.pl[t] && st.types.has(e.ty) ? 1 : 0), 0);

  // ---- map

  const defs = el("defs", {}, svg);
  const mkPat = (id, body) => { const p = el("pattern", { id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs); p.innerHTML = body; };
  mkPat("hatch", '<line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--surface);stroke-width:3;opacity:.72"/>');
  mkPat("dots", '<circle cx="3.5" cy="3.5" r="1.5" style="fill:var(--surface);opacity:.8"/>');
  const vp = el("g", {}, svg), gLand = el("g", {}, vp), gOut = el("g", {}, vp), gFront = el("g", {}, vp), gSel = el("g", {}, vp), gLab = el("g", {}, vp), gNat = el("g", {}, vp), gMark = el("g", {}, vp);
  const cells = [];
  for (const t of T) {
    const parts = t.regions.length ? t.regions : [{ name: "", polys: t.polys }];
    for (const r of parts) {
      const d = pathOf(r.polys);
      const base = el("path", { d, class: t.sea ? "sea" : "cell" }, gLand);
      const pat = t.sea ? null : el("path", { d, class: "pat", fill: "none" }, gLand);
      const c = { t, r: r.name, base, pat, whole: pathOf(t.polys) };
      cells.push(c);
      if (!t.sea) {
        base.addEventListener("click", () => { if (!moved) select(t.name, st.regions ? r.name : ""); });
        base.addEventListener("pointermove", ev => tip(ev, c));
        base.addEventListener("pointerleave", () => { $("tip").hidden = true; });
      }
    }
    t.outline = el("path", { d: pathOf(t.polys), class: "outline" }, gOut);

      d.append(h("p", { textContent: x.tx, style: "color:var(--ink)" })); if (x.u) d.append(h("a", { href: x.u, target: "_blank", rel: "noopener", textContent: "source", style: "font-weight:400;font-size:.82rem" })); b.append(d); }
  }

  // ---- timeline
  const hist = $("hist"); const counts = S.map((_, i) => evBySeason[i].length), max = Math.max(...counts, 1);
  const bars = [], years = $("years");
  hist.style.gridTemplateColumns = years.style.gridTemplateColumns = `repeat(${S.length}, minmax(0, 1fr))`;
  S.forEach((s, i) => { const b = h("button", { title: `${s}: ${counts[i]} located events`, onclick: () => setSeason(i) }); b.setAttribute("aria-label", b.title);
    b.style.height = Math.max(7, counts[i] / max * 100) + "%"; hist.append(b); bars.push(b);
    if (i === 0 || S[i - 1].slice(0, 3) !== s.slice(0, 3)) { let n = 1; while (i + n < S.length && S[i + n].slice(0, 3) === s.slice(0, 3)) n++;
      const y = h("span"); y.dataset.full = n > 1 ? s.slice(0, 5) : ""; y.dataset.short = n > 1 ? s.slice(0, 3) : ""; y.dataset.k = years.children.length;
      y.style.gridColumn = `${i + 1} / span ${n}`; years.append(y); } });
  function yearLabels() { const col = years.clientWidth / S.length * 4;
    for (const y of years.children) y.textContent = col >= 40 ? y.dataset.full : col >= 24 ? y.dataset.short : (y.dataset.k % 3 === 1 ? y.dataset.short : ""); }
  yearLabels(); addEventListener("resize", yearLabels);
  for (const br of D.breaks || []) {
    const m = h("div", { className: "brk", title: br.note }, h("span", { textContent: br.label }));
    m.setAttribute("role", "note"); m.setAttribute("aria-label", br.note);
    m.style.left = `calc(${(br.i / S.length) * 100}% - 1px)`; hist.append(m);
  }
  const range = $("season"); range.max = last; range.value = st.s;
  range.addEventListener("input", () => setSeason(+range.value));
  function setSeason(i) { st.s = Math.max(0, Math.min(last, i)); range.value = st.s; render(); }
  $("prev").onclick = () => setSeason(st.s - 1); $("next").onclick = () => setSeason(st.s + 1);
  $("play").onclick = () => { if (st.playing) { clearInterval(st.playing); st.playing = null; } else { if (st.s === last) setSeason(0);
      st.playing = setInterval(() => { if (st.s >= last) { clearInterval(st.playing); st.playing = null; $("play").textContent = "▶ Play"; } else setSeason(st.s + 1); }, 1100); }
    $("play").textContent = st.playing ? "❚❚ Pause" : "▶ Play"; };

  // ---- controls
  const setMode = m => { st.mode = m; if (m !== "holder") st.iso = null; $("mode-holder").setAttribute("aria-pressed", m === "holder"); $("mode-territory").setAttribute("aria-pressed", m === "territory"); render(); };
  $("mode-holder").onclick = () => setMode("holder"); $("mode-territory").onclick = () => setMode("territory");
  $("show-regions").onchange = e => { st.regions = e.target.checked; if (!st.regions && st.sel) st.sel.r = ""; render(); };
  $("show-marks").onchange = e => { st.marks = e.target.checked; paint(); };
  const LABS = ["nations", "territories", "regions", "none"];
  for (const m of LABS) $("lab-" + m).onclick = () => { st.lab = m; for (const x of LABS) $("lab-" + x).setAttribute("aria-pressed", x === m); labels(); };
  $("show-front").onchange = e => { st.front = e.target.checked; frontiers(); };
  for (const [id, tab] of [["tab-place", "place"], ["tab-holders", "holders"], ["tab-history", "history"]]) $(id).onclick = () => { st.tab = tab; render(); };
  const q = $("q"), res = $("results");
  const index = []; for (const t of T) { if (t.sea) continue; index.push({ label: t.name, sub: "Territory", go: () => { select(t.name, ""); focusOn(t); } });
    for (const r of t.regions) index.push({ label: r.name, sub: "Region of " + t.name, go: () => { select(t.name, r.name); focusOn(t); } }); }
  D.events.forEach(e => index.push({ label: e.ti, sub: `${e.ty}, ${S[e.s]}`, go: () => { st.s = e.s; range.value = e.s; const t = Object.keys(e.pl)[0]; select(t, ""); focusOn(byName[t]); } }));
  q.addEventListener("input", () => { const v = q.value.trim().toLowerCase(); res.innerHTML = ""; if (v.length < 2) { res.hidden = true; return; }
    const hits = index.filter(x => x.label.toLowerCase().includes(v)).sort((a, b) => a.label.toLowerCase().indexOf(v) - b.label.toLowerCase().indexOf(v)).slice(0, 14);
    if (!hits.length) res.append(h("div", { className: "empty", textContent: "No place or event matches.", style: "padding:6px 8px" }));
    for (const x of hits) res.append(h("button", { onclick: () => { res.hidden = true; q.value = ""; x.go(); } }, x.label, h("small", { textContent: x.sub }))); res.hidden = false; });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });

  function render() {
    const re = (D.real || [])[st.s];
    $("now").innerHTML = `${esc(S[st.s])}<small>${re ? esc(re.n) + " · " : ""}${evBySeason[st.s].length} located events</small>`;
    bars.forEach((r, i) => r.classList.toggle("on", i === st.s));
    $("tab-place").textContent = st.sel ? (st.sel.r || st.sel.t) : "Season";
    for (const [id, tab] of [["tab-place", "place"], ["tab-holders", "holders"], ["tab-history", "history"]]) $(id).setAttribute("aria-selected", st.tab === tab);
    const b = $("pbody"), top = b.scrollTop; b.innerHTML = "";
    (st.tab === "holders" ? panelHolders : st.tab === "history" ? panelHistory : panelPlace)(b);
    b.scrollTop = st.keep ? top : 0; paint();
  }
  render();
  window.__atlas = { st, setSeason, select, holderAt, majority };
}
})();
</script>
